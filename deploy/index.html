<!DOCTYPE html>
<html>
<head>

    href value below to reflect the base path you are serving from.

    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FaidaBiz — Simple Business Management App. Jua Mauzo Yako, Dhibiti Biashara Yako, Ongeza Faida.">
  <meta name="keywords" content="FaidaBiz, mauzo, bidhaa, biashara, faida, Tanzania">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FaidaBiz">
  <meta property="og:description" content="Jua Mauzo Yako, Dhibiti Biashara Yako, Ongeza Faida.">
  <meta property="og:site_name" content="FaidaBiz">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="FaidaBiz">
  <meta name="twitter:description" content="Simple business notebook for small shops.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Performance optimizations -->
  <meta name="theme-color" content="#15803D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FaidaBiz">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="flutter.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">
  
  <!-- Drift Web Database Support -->
  <script src="sql-wasm.js"></script>
  <script src="sql-wasm.wasm"></script>
  
  <!-- Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Optimized Google Fonts loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font loading optimization for Safari -->
  <style>
    /* Font loading optimization for Safari iOS */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiJ-Ek-_EeA.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    
    /* Fallback fonts for Safari */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
    }
    
    /* Prevent font flash */
    .font-loading {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
  </style>

  <title>FaidaBiz</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen styles -->
  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #166534 0%, #15803D 40%, #0B1A12 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading-screen.lotigas {
      background: #FFD700;
    }

    #loading-screen.lotigas .loading-text,
    #loading-screen.lotigas .loading-subtext,
    #loading-screen.lotigas .loading-brand {
      color: #000000;
    }

    #loading-screen.lotigas .loading-spinner {
      border-color: rgba(0, 0, 0, 0.12);
      border-top-color: #000000;
    }
    
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    
    .loading-brand {
      margin: 0;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2.4rem, 8vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      line-height: 1;
    }

    .loading-text {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
    }

    .loading-subtext {
      margin-top: 6px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
    }

    .loading-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      object-fit: cover;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>

  <script>
    (function () {
      var host = window.location.hostname.toLowerCase();
      var isLotiGas = host.indexOf('lotigas') !== -1;
      window.__isLotiGasHost = isLotiGas;
      document.addEventListener('DOMContentLoaded', function () {
        var screen = document.getElementById('loading-screen');
        var logo = document.getElementById('loading-logo');
        var brand = document.getElementById('loading-brand');
        var title = document.getElementById('loading-title');
        var sub = document.getElementById('loading-subtitle');
        if (!screen) return;
        if (isLotiGas) {
          screen.classList.add('lotigas');
          document.title = 'Loti Gas';
          if (logo) {
            logo.src = 'lotigas_logo.png';
            logo.alt = 'Loti Gas';
            logo.style.display = '';
          }
          if (brand) brand.textContent = 'Loti Gas';
          if (title) title.textContent = 'Loading…';
          if (sub) sub.textContent = 'Cylinder tracking · Inventory · Delivery';
        }
      });
    })();
  </script>

  <script>
    // Google Maps auth failures (Flutter web) — visible in browser DevTools console.
    window.__whatslipaMapsAuthError = null;
    window.gm_authFailure = function () {
      window.__whatslipaMapsAuthError =
        'Google Maps authentication failed. Enable Maps JavaScript API (not only Android SDK) and add this site to HTTP referrer restrictions.';
      console.error('[WhatsLipa Maps][ERROR]', window.__whatslipaMapsAuthError);
      console.error('[WhatsLipa Maps][ERROR] Current origin:', window.location.origin);
    };
  </script>
  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = 'faceaccess-v1.0.0';
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading-screen">
    <img id="loading-logo" src="faidabiz_logo.png" alt="FaidaBiz" class="loading-logo" width="88" height="88">
    <h1 id="loading-brand" class="loading-brand">FaidaBiz</h1>
    <div class="loading-spinner"></div>
    <div id="loading-title" class="loading-text">Loading…</div>
    <div id="loading-subtitle" class="loading-subtext">Jua Mauzo Yako, Dhibiti Biashara Yako, Ongeza Faida</div>
  </div>

  <script>
    // Prevent PWA install prompt from showing
    window.addEventListener('beforeinstallprompt', function(e) {
      // Prevent the default mini-infobar from appearing
      e.preventDefault();
      // Optionally, log that the prompt was prevented
      console.log('PWA install prompt prevented');
      // Return false to indicate we don't want to show the prompt
      return false;
    }, { passive: false });

    // Hide loading screen when app is ready
    function hideLoadingScreen() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.style.opacity = '0';
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 300);
      }
    }

    // Optimized app loading
    window.addEventListener('load', function(ev) {
      // Download main.dart.js with timeout
      const timeout = setTimeout(() => {
        console.warn('App loading timeout - showing app anyway');
        hideLoadingScreen();
      }, 10000); // 10 second timeout

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            clearTimeout(timeout);
            appRunner.runApp();
            // Hide loading screen after a short delay
            setTimeout(hideLoadingScreen, 500);
          }).catch(function(error) {
            console.error('Failed to initialize app:', error);
            clearTimeout(timeout);
            hideLoadingScreen();
          });
        }
      });
    });
  </script>
</body>
</html>
